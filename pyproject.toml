[project]
name = "jeju-festival-lab"
version = "0.1.0"
description = "제주 데이터 기반 지역 축제 기획 Agent"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit>=1.40,<2",
  "duckdb>=1.1,<2",
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "plotly>=5.24,<7",
  "httpx>=0.27,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
